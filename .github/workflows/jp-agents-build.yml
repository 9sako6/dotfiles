name: jp-agents-build

on:
  pull_request:
    paths:
      - .github/workflows/jp-agents-build.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Lix
        run: ./bin/install-lix.sh

      - name: Install mise
        run: ./bin/install-mise.sh

      - name: Trust repository mise config
        run: '"$HOME/.local/bin/mise" trust'

      - name: Activate Home Manager user environment
        run: |
          nix_bin=/nix/var/nix/profiles/default/bin/nix
          primary_user="$(id -un)"
          activation_package="$(
            DARWIN_PRIMARY_USER="$primary_user" \
            DOTFILES_DIR="$GITHUB_WORKSPACE" \
            "$nix_bin" \
              --extra-experimental-features "nix-command flakes" \
              build \
              --impure \
              --no-link \
              --print-out-paths \
              "path:$GITHUB_WORKSPACE#darwinConfigurations.current.config.home-manager.users.$primary_user.home.activationPackage"
          )"
          HOME_MANAGER_BACKUP_EXT=pre-home-manager "$activation_package/activate"
          cd "$HOME"
          "$HOME/.local/bin/mise" bootstrap --yes --verbose

      - name: Install jp skill and build agents
        run: |
          export PATH="$HOME/.local/bin:$HOME/.nix-profile/bin:$PATH"
          DOTFILES_DIR="$GITHUB_WORKSPACE" cargo run --locked --manifest-path cli/Cargo.toml -- agents install ./.apm/skills/jp
          DOTFILES_DIR="$GITHUB_WORKSPACE" cargo run --locked --manifest-path cli/Cargo.toml -- agents build

      - name: Commit generated resources
        run: |
          if git diff --quiet && test -z "$(git status --short --untracked-files=all)"; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add home
          git commit -m "Build jp agent resources"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
