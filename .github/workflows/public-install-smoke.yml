name: public-install-smoke

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: public-install-smoke
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  public-install-smoke:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Verify secrets are absent before install
        run: test ! -e "$HOME/.zsh.d/secrets.zsh"

      - name: Install Lix
        run: ./bin/install-lix.sh

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Install mise
        run: |
          ./bin/install-mise.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare Bun
        run: |
          mise trust
          mise trust "$GITHUB_WORKSPACE/home/.config/mise/config.toml"
          MISE_CONFIG_FILE="$GITHUB_WORKSPACE/home/.config/mise/config.toml" mise install --locked bun

      - name: Deploy public home and fixed tools
        run: |
          MISE_CONFIG_FILE="$GITHUB_WORKSPACE/home/.config/mise/config.toml" mise exec -- mise run home:apply

      - name: Build system configuration and resources
        run: |
          /nix/var/nix/profiles/default/bin/nix \
            --extra-experimental-features "nix-command flakes" \
            build --impure --no-update-lock-file --no-write-lock-file \
            --file nix/apply.nix --argstr directory "$GITHUB_WORKSPACE" \
            --argstr user "$(id -un)" bundle --out-link "$RUNNER_TEMP/dotfiles-system"

      - name: Verify shell plugins converged by bootstrap
        run: '"$HOME/.local/bin/mise" bootstrap repos status --missing'

      - name: Verify shell plugins load in an interactive shell
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          script -q /dev/null zsh -i -c '
            [[ -n $ZSH_HIGHLIGHT_VERSION ]] || exit 1
            [[ -n $functions[_zsh_autosuggest_start] ]] || exit 1
            whence -w abbrev-alias | grep -q function || exit 1
            [[ "$(command -v fd)" == "$(mise which fd)" ]] || exit 1
            [[ "$(command -v fzf)" == "$(mise which fzf)" ]] || exit 1
            print zinit-plugins-ok
          '
          "$HOME/.local/bin/mise" bootstrap repos status --missing

      - name: Generate and deploy agent resources
        run: |
          mise exec -- mise run agents:apply
          for resource in .agents/skills .claude/rules .claude/settings.json .claude/skills .codex/AGENTS.md; do
            diff -r "home/$resource" "$HOME/$resource"
          done

      - name: Verify secrets are absent after install
        run: test ! -e "$HOME/.zsh.d/secrets.zsh"

      - name: Verify home-managed daily-use tools
        run: |
          export PATH="$HOME/.nix-profile/bin:$HOME/.local/bin:$PATH"
          test "$(mise exec -- sh -c 'command -v fd')" = "$(mise which fd)"
          test "$(mise exec -- sh -c 'command -v fzf')" = "$(mise which fzf)"
          mise exec -- agy --version
          mise exec -- atuin --version
          mise exec -- bun --version
          mise exec -- cargo --version
          mise exec -- codex --version
          mise exec -- fd --version
          mise exec -- fzf --version
          mise exec -- gh --version
          mise exec -- ghq --version
          mise exec -- gitleaks version
          mise exec -- git --version
          mise exec -- go version
          mise exec -- herdr --version
          mise exec -- pnpm --version
          mise exec -- quint --version
          mise exec -- rg --version
          mise exec -- rustc --version
          mise exec -- terminal-browser --version
          mise exec -- zoxide --version
