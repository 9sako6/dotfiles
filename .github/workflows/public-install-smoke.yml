name: public-install-smoke

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: public-install-smoke
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  public-install-smoke:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Verify secrets are absent before install
        run: test ! -e "$HOME/.zsh.d/secrets.zsh"

      - name: Install Lix
        run: ./bin/install-lix.sh

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Install mise
        run: ./bin/install-mise.sh

      - name: Trust repository mise config
        run: '"$HOME/.local/bin/mise" trust'

      - name: Build system configuration
        run: |
          DOTFILES_DIR="$GITHUB_WORKSPACE" \
            /nix/var/nix/profiles/default/bin/nix \
              --extra-experimental-features "nix-command flakes" \
              run .#dotfiles -- plan --default

      - name: Activate Home Manager user environment
        run: |
          nix_bin=/nix/var/nix/profiles/default/bin/nix
          primary_user="$(id -un)"
          activation_package="$(
            DARWIN_PRIMARY_USER="$primary_user" \
            DOTFILES_DIR="$GITHUB_WORKSPACE" \
            "$nix_bin" \
              --extra-experimental-features "nix-command flakes" \
              build \
              --impure \
              --no-link \
              --print-out-paths \
              "path:$GITHUB_WORKSPACE#darwinConfigurations.current.config.home-manager.users.$primary_user.home.activationPackage"
          )"
          HOME_MANAGER_BACKUP_EXT=pre-home-manager "$activation_package/activate"
          cd "$HOME"
          "$HOME/.local/bin/mise" bootstrap --yes --verbose

      - name: Verify zinit plugins converged by bootstrap
        run: '"$HOME/.local/bin/mise" bootstrap repos status --missing'

      - name: Verify zinit plugins load in an interactive shell
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          script -q /dev/null zsh -i -c '
            [[ -n $ZSH_HIGHLIGHT_VERSION ]] || exit 1
            [[ -n $functions[_zsh_autosuggest_start] ]] || exit 1
            whence -w abbrev-alias | grep -q function || exit 1
            print zinit-plugins-ok
          '
          "$HOME/.local/bin/mise" bootstrap repos status --missing

      - name: Verify generated agent resources
        run: |
          "$HOME/.local/bin/mise" run agents:build
          git diff --exit-code -- home
          test -z "$(git status --short --untracked-files=all -- home)"

      - name: Verify secrets are absent after install
        run: test ! -e "$HOME/.zsh.d/secrets.zsh"

      - name: Verify home-managed daily-use tools
        run: |
          export PATH="$HOME/.nix-profile/bin:$HOME/.local/bin:$PATH"
          mise exec -- atuin --version
          bun --version
          cargo --version
          mise exec -- codex --version
          mise exec -- fd --version
          mise exec -- fzf --version
          mise exec -- gh --version
          mise exec -- ghq --version
          mise exec -- gitleaks version
          git --version
          go version
          mise exec -- herdr --version
          mise exec -- pnpm --version
          quint --version
          mise exec -- rg --version
          rustc --version
          mise exec -- zoxide --version
