name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks git --redact --no-banner --exit-code 1

  contract-test:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Install Lix
        run: |
          if ! command -v nix >/dev/null 2>&1; then
            NIX_INSTALLER_EXTRA_CONF="trusted-users = root $(id -un)" ./bin/install-lix.sh
          fi
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true

      - name: Run repository tests with Nix-managed tools
        run: |
          nix --extra-experimental-features "nix-command flakes" shell .#userTools --command /bin/bash -c '
            set -eu
            bun install --frozen-lockfile
            bun run tsc --noEmit
            bun test ./tests ./home/.apm/skills/create-anki-cards/tools/anki-cards.test.ts
            cargo test --locked --manifest-path cli/Cargo.toml
          '
