name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks git --redact --no-banner --exit-code 1

  contract-test:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NIX_CONFIG: extra-experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Prepare mise and Bun
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/home/.config/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          ./bin/install-mise.sh
          "$HOME/.local/bin/mise" install --locked bun
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(dirname "$("$HOME/.local/bin/mise" which bun)")" >> "$GITHUB_PATH"

      - name: Deploy public home and fixed tools
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/home/.config/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          test ! -e "$HOME/.zsh.d/secrets.zsh"
          mkdir -p "$HOME/.zsh.d"
          printf runtime > "$HOME/.zsh.d/runtime.zsh"
          ln -s "$GITHUB_WORKSPACE/dist/.zsh.d/alias.zsh" "$HOME/.zsh.d/alias.zsh"
          mise exec -- mise run home:apply
          test "$(cat "$HOME/.zsh.d/runtime.zsh")" = runtime

      - name: Verify daily-use tools start
        run: |
          for tool in agy atuin bun cargo codex fd fzf gh ghq git herdr pnpm quint rg rustc terminal-browser zoxide; do
            mise exec -- "$tool" --version
          done
          mise exec -- aws --version
          mise exec -- blacksmith --version
          mise exec -- gitleaks version
          mise exec -- go version
          mise exec -- nightlight --help
          mise exec -- ruby -ropenssl -rpsych -e 'puts RUBY_VERSION'
          mise exec -- duckdb -no-agent :memory: 'SELECT 42;'

      - name: Verify shell plugins load
        run: |
          zsh -i -c '
            [[ -n $ZSH_HIGHLIGHT_VERSION ]] || exit 1
            [[ -n $functions[_zsh_autosuggest_start] ]] || exit 1
            whence -w abbrev-alias | grep -q function || exit 1
            alias codex >/dev/null || exit 1
            [[ "$(command -v fd)" == "$(mise which fd)" ]] || exit 1
            [[ "$(command -v fzf)" == "$(mise which fzf)" ]] || exit 1
          '
          mise bootstrap repos status --missing

      - name: Generate and deploy agent resources
        run: |
          mise exec -- mise run agents:apply
          for resource in .agents/skills .claude/rules .claude/settings.json .claude/skills .codex/AGENTS.md; do
            diff -r "home/$resource" "$HOME/$resource"
          done
          test ! -e "$HOME/.zsh.d/secrets.zsh"

      - name: Verify FFmpeg media behavior
        run: |
          export DOTFILES_TEST_FFMPEG="$(mise which ffmpeg)"
          export DOTFILES_TEST_FFPROBE="$(mise which ffprobe)"
          python3 -m unittest discover -s tests -p test_ffmpeg.py -v

      - name: Check TypeScript and shell contracts
        run: |
          bun install --frozen-lockfile
          bin/check-for-agent

      - name: Install Lix
        run: |
          if ! command -v nix >/dev/null 2>&1; then
            ./bin/install-lix.sh
          fi
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Check artifact and private composition
        run: |
          nix build --no-link --no-update-lock-file --no-write-lock-file \
            .#checks.aarch64-darwin.artifacts .#checks.aarch64-darwin.composition .#checks.aarch64-darwin.configuration

      - name: Check Nix and settings contracts
        run: python3 -m unittest discover -s nix/tests -p "test_*.py"

      - name: Check system derivation
        run: nix eval --raw .#darwinConfigurations.current.system.drvPath
