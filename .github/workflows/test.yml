name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks git --redact --no-banner --exit-code 1

  rootless-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Prepare mise and Bun
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          MISE_CONFIG_FILE: ${{ github.workspace }}/home/.config/mise/config.toml
        run: |
          ./bin/install-mise.sh
          "$HOME/.local/bin/mise" install bun
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(dirname "$("$HOME/.local/bin/mise" which bun)")" >> "$GITHUB_PATH"
      - name: Verify actual home and agents tasks without Nix or Rust
        run: bun test tests/apply.test.ts

  contract-test:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NIX_CONFIG: extra-experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Install Lix
        run: |
          if ! command -v nix >/dev/null 2>&1; then
            ./bin/install-lix.sh
          fi
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Verify mise-managed Git behavior
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/home/.config/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          MISE_AUTO_INSTALL: "false"
        run: |
          ./bin/install-mise.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          before="$(shasum -a 256 home/.config/mise/config.toml home/.config/mise/mise.lock)"
          "$HOME/.local/bin/mise" install --locked conda:git
          test "$before" = "$(shasum -a 256 home/.config/mise/config.toml home/.config/mise/mise.lock)"
          export DOTFILES_TEST_GIT="$("$HOME/.local/bin/mise" which git)"
          "$DOTFILES_TEST_GIT" ls-remote https://github.com/9sako6/dotfiles.git refs/heads/master
          nix shell .#ciTools --command /bin/bash -c '
            set -eu
            bun install --frozen-lockfile
            export PATH="$(dirname "$DOTFILES_TEST_GIT"):$PATH"
            bun test tests/shell-config.test.ts -t "pre-commit|git undo"
          '

      - name: Verify mise-managed FFmpeg media behavior
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/home/.config/mise/config.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          MISE_AUTO_INSTALL: "false"
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          before="$(shasum -a 256 home/.config/mise/config.toml home/.config/mise/mise.lock)"
          "$HOME/.local/bin/mise" install --force --locked conda:ffmpeg
          test "$before" = "$(shasum -a 256 home/.config/mise/config.toml home/.config/mise/mise.lock)"
          DOTFILES_TEST_FFMPEG="$("$HOME/.local/bin/mise" which ffmpeg)"
          DOTFILES_TEST_FFPLAY="$("$HOME/.local/bin/mise" which ffplay)"
          DOTFILES_TEST_FFPROBE="$("$HOME/.local/bin/mise" which ffprobe)"
          export DOTFILES_TEST_FFMPEG DOTFILES_TEST_FFPLAY DOTFILES_TEST_FFPROBE
          test -x "$DOTFILES_TEST_FFMPEG"
          test -x "$DOTFILES_TEST_FFPLAY"
          test -x "$DOTFILES_TEST_FFPROBE"
          file -L "$DOTFILES_TEST_FFMPEG" "$DOTFILES_TEST_FFPLAY" "$DOTFILES_TEST_FFPROBE"
          "$DOTFILES_TEST_FFMPEG" -buildconf
          python3 -m unittest discover -s tests -p test_ffmpeg.py -v
          # Compare the same media contract with the previously deployed Nix
          # distribution. It remains a CI baseline, not a public home owner.
          baseline="$(nix build --no-link --print-out-paths --no-update-lock-file --no-write-lock-file --impure --expr '
            let
              flake = builtins.getFlake ("git+file://" + builtins.getEnv "GITHUB_WORKSPACE");
              pkgs = import flake.inputs.nixpkgs { system = "aarch64-darwin"; };
            in pkgs.lib.getBin pkgs.ffmpeg
          ')"
          DOTFILES_TEST_FFMPEG="$baseline/bin/ffmpeg" \
          DOTFILES_TEST_FFPLAY="$baseline/bin/ffplay" \
          DOTFILES_TEST_FFPROBE="$baseline/bin/ffprobe" \
            python3 -m unittest discover -s tests -p test_ffmpeg.py -v

      - name: Check TypeScript and shell contracts
        run: |
          nix shell .#ciTools --command /bin/bash -c '
            set -eu
            bun install --frozen-lockfile
            bun run tsc --noEmit
            bun test ./tests ./home/.apm/skills/anki/tools/*.test.ts
          '

      - name: Check artifact and private composition
        run: |
          nix build --no-link --no-update-lock-file --no-write-lock-file \
            .#checks.aarch64-darwin.artifacts .#checks.aarch64-darwin.composition .#checks.aarch64-darwin.configuration

      - name: Check local LLM boundaries
        run: |
          nix shell .#ciTools --command /bin/bash -c '
            set -eu
            opencode_package="$(nix build --no-link --print-out-paths .#localllmClient)"
            goal_plugin="$(nix build --no-link --print-out-paths .#localllmGoalPlugin)"
            DOTFILES_TEST_OPENCODE="$opencode_package/bin/opencode" DOTFILES_TEST_GOAL_PLUGIN="$goal_plugin" python3 -m unittest discover -s nix/localllm -p "test_*.py"
          '

      - name: Check Nix and settings contracts
        run: |
          nix shell .#ciTools --command /bin/bash -c '
            set -eu
            python3 -m unittest discover -s nix/tests -p "test_*.py"
          '

      - name: Check fixed model metadata online and offline
        run: |
          nix build --no-link .#checks.aarch64-darwin.modelFetch
          nix build --no-link --offline .#checks.aarch64-darwin.modelFetch
          nix eval --raw .#darwinConfigurations.current.system.drvPath
