name: test

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks git --redact --no-banner --exit-code 1

  contract-test:
    needs: secret-scan
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Install mise
        run: ./bin/install-mise.sh

      - name: Run contract tests
        run: |
          "$HOME/.local/bin/mise" trust
          "$HOME/.local/bin/mise" run test

  public-install-smoke:
    needs: contract-test
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Verify secrets are absent before install
        run: test ! -e "$HOME/.zsh.d/secrets.zsh"

      - name: Install mise
        run: ./bin/install-mise.sh

      - name: Install user environment
        run: |
          "$HOME/.local/bin/mise" trust
          "$HOME/.local/bin/mise" run install:user

      - name: Verify generated agent resources
        run: |
          "$HOME/.local/bin/mise" run agents:build
          git diff --exit-code -- home
          test -z "$(git status --short --untracked-files=all -- home)"

      - name: Install Lix
        run: ./bin/install-lix.sh

      - name: Build system configuration
        run: ./bin/build-system.sh

      - name: Verify secrets are absent after install
        run: test ! -e "$HOME/.zsh.d/secrets.zsh"

      - name: Verify home-managed daily-use tools
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise exec -- atuin --version
          mise exec -- bun --version
          mise exec -- codex --version
          dot --help
          mise exec -- fd --version
          mise exec -- fzf --version
          mise exec -- gh --version
          mise exec -- ghq --version
          mise exec -- gitleaks version
          git --version
          mise exec -- herdr --version
          mise exec -- pnpm --version
          mise exec -- rg --version
          mise exec -- zoxide --version
