name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks git --redact --no-banner --exit-code 1

  contract-test:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NIX_CONFIG: extra-experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Install Lix
        run: |
          if ! command -v nix >/dev/null 2>&1; then
            ./bin/install-lix.sh
          fi
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Run repository tests with Nix-managed tools
        run: |
          nix shell .#userTools --command /bin/bash -c '
            set -eu
            bun install --frozen-lockfile
            bun run tsc --noEmit
            bun test ./tests ./home/.apm/skills/anki/tools/*.test.ts
            cargo fmt --check --manifest-path cli/Cargo.toml
            cargo clippy --locked --manifest-path cli/Cargo.toml --all-targets -- -D warnings
            cargo test --locked --manifest-path cli/Cargo.toml
            cargo test --locked --manifest-path cli/Cargo.toml --test zinit -- --ignored
            cargo test --locked --manifest-path cli/Cargo.toml --test activation -- --ignored
            cargo test --locked --manifest-path cli/Cargo.toml --bin dotfiles system::fast_path_tests::nix_generation_contains_the_inputs_used_by_the_copy_fast_path -- --ignored --exact
            nix build --no-link .#checks.aarch64-darwin.composition .#checks.aarch64-darwin.configuration
            opencode_package="$(nix build --no-link --print-out-paths .#localllmClient)"
            goal_plugin="$(nix build --no-link --print-out-paths .#localllmGoalPlugin)"
            DOTFILES_TEST_OPENCODE="$opencode_package/bin/opencode" DOTFILES_TEST_GOAL_PLUGIN="$goal_plugin" python3 -m unittest discover -s nix/localllm -p "test_*.py"
            python3 -m unittest discover -s nix/tests -p "test_*.py"
            nix build --no-link .#checks.aarch64-darwin.modelFetch
            nix build --no-link --offline .#checks.aarch64-darwin.modelFetch
            nix eval --raw .#darwinConfigurations.current.system.drvPath
          '
