[tools]
antigravity-cli = "1.2.2"
atuin = "18.18.1"
awscli = "2.35.11"
# Bitwarden CLI (bw)
bitwarden = "2026.9.1"
# Secrets Manager CLI (bws)
bitwarden-secrets-manager = "2.1.0"
bun = "1.3.13"
claude = "2.1.220"
"conda:ffmpeg" = "8.1.2"
"conda:git" = "2.55.0"
direnv = "2.37.1"
duckdb = "1.5.5"
ecspresso = "2.8.5"
fd = "10.5.0"
fzf = "0.74.4"
gh = "2.97.0"
ghq = "1.10.1"
"github:zenbu-labs/terminal-browser" = "0.6.0"
gitleaks = "8.30.1"
go = "1.26.5"
herdr = "0.8.2"
lefthook = "2.1.10"
node = "26.5.1"
opencode = "1.18.11"
"npm:@deepseek-ai/dsh" = "0.2.0-rc.2"
"npm:@devcontainers/cli" = "0.88.0"
"npm:@informalsystems/quint" = "0.32.0"
"npm:@openai/codex" = "0.155.1"
"npm:@openai/codex-security" = "0.1.5"
"npm:hunkdiff" = "0.17.7"
"pipx:apm-cli" = "0.26.0"
pnpm = "11.20.0"
ripgrep = "15.2.0"
ruby = "4.0.6"
rust = { version = "1.97.1", components = ["rustfmt", "clippy"] }
uv = "0.12.1"
xcodegen = "2.46.0"
zoxide = "0.10.0"

[env]
AGY_CLI_DISABLE_AUTO_UPDATE = "true"

[settings]
activate_aggressive = true
auto_install = false
disable_tools = ["awscli"]

[settings.github]
credential_command = 'gh_path="$(mise which gh)"; exec "$gh_path" auth token'

[settings.ruby]
compile = true

[bootstrap.repos]
"~/.local/share/zinit/plugins/momo-lab---zsh-abbrev-alias" = { url = "https://github.com/momo-lab/zsh-abbrev-alias.git", ref = "33fe094da0a70e279e1cc5376a3d7cb7a5343df5" }
"~/.local/share/zinit/plugins/zsh-users---zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5" }
"~/.local/share/zinit/plugins/zsh-users---zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git", ref = "1d85c692615a25fe2293bdd44b34c217d5d2bf04" }
