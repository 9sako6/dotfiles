[package]
name = "dotfiles"
version = "0.1.0"
edition = "2021"
description = "Global dotfiles entrypoint for system operations"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "=0.16.3"
fs2 = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tabled = { version = "=0.21.0", default-features = false, features = ["ansi"] }
tempfile = "3"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
