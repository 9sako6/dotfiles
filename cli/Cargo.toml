[package]
name = "dotfiles"
version = "0.1.0"
edition = "2021"
description = "Global dotfiles entrypoint for system operations"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde", "std"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
