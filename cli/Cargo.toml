[package]
name = "dotfiles"
version = "0.1.0"
edition = "2021"
description = "Global dotfiles entrypoint — delegates to mise run plan/apply from any directory"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
