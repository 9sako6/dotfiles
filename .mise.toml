[settings]
auto_install = false

[tasks."agents:build"]
run = "DOTFILES_DIR=\"$PWD\" cargo run --locked --manifest-path cli/Cargo.toml -- agents build"
description = "Build agents resources via apm"

[tasks."agents:install"]
run = "DOTFILES_DIR=\"$PWD\" cargo run --locked --manifest-path cli/Cargo.toml -- agents install"
description = "Install an agents skill via apm, then build agents resources"

[tasks."agents:remove-local"]
run = "DOTFILES_DIR=\"$PWD\" cargo run --locked --manifest-path cli/Cargo.toml -- agents remove-local"
description = "Remove a repository-owned local agents skill, then build agents resources"

[tasks."agents:uninstall"]
run = "DOTFILES_DIR=\"$PWD\" cargo run --locked --manifest-path cli/Cargo.toml -- agents uninstall"
description = "Uninstall an agents skill via apm, then build agents resources"

[tasks."agents:update"]
run = "DOTFILES_DIR=\"$PWD\" cargo run --locked --manifest-path cli/Cargo.toml -- agents update"
description = "Update an agents skill via apm, then build agents resources"

[tasks."container-runtime:bench"]
run = "bun bench/container-runtime/bench.ts run"
description = "Benchmark macOS, Colima, and Apple container machine runtimes"

[tasks."container-runtime:prepare"]
run = "bun bench/container-runtime/bench.ts prepare"
description = "Prepare isolated Colima and Apple container benchmark runtimes"

[tasks."herdr:integrations:apply"]
run = [
  "herdr integration install claude",
  "herdr integration install codex",
  "herdr integration install hermes",
  "herdr integration install opencode",
]
description = "Reconcile Herdr integrations"

[tasks."mybin:build"]
run = "./bin/build-tada.sh"
description = "Build reproducible mybin assets"

[tasks.plan]
run = "DOTFILES_DIR=\"$PWD\" cargo run --locked --manifest-path cli/Cargo.toml -- plan"
description = "Build and show the macOS system and home plan"

[tasks."system:rollback"]
run = "./bin/system-rollback.sh"
description = "Switch to the previous nix-darwin generation"
