[tools]
bun = "1.3.12"
swift = "6.2.3"

[settings]
auto_install = false

[tasks."agents:build"]
run = "./bin/build-agents.ts"
description = "Build agents resources via apm"

[tasks."agents:install"]
run = "./bin/build-agents.ts install"
description = "Install an agents skill via apm, then build agents resources"

[tasks."agents:remove-local"]
run = "./bin/build-agents.ts remove-local"
description = "Remove a repository-owned local agents skill, then build agents resources"

[tasks."agents:uninstall"]
run = "./bin/build-agents.ts uninstall"
description = "Uninstall an agents skill via apm, then build agents resources"

[tasks."agents:update"]
run = "./bin/build-agents.ts update"
description = "Update an agents skill via apm, then build agents resources"

[tasks.apply]
run = "./bin/system.ts apply"
description = "Plan and apply the macOS system and home configuration"

[tasks.doctor]
run = "./bin/doctor.ts"
description = "Diagnose system, mise, and package-manager drift"

[tasks."herdr:integrations:apply"]
run = [
  "herdr integration install claude",
  "herdr integration install codex",
  "herdr integration install hermes",
  "herdr integration install opencode",
]
description = "Reconcile Herdr integrations"

[tasks."mybin:build"]
run = "./bin/build-tada.sh"
description = "Build reproducible mybin assets"

[tasks.plan]
run = "./bin/system.ts plan"
description = "Build and show the macOS system and home plan"

[tasks."system:rollback"]
run = "./bin/system-rollback.sh"
description = "Switch to the previous nix-darwin generation"

[tasks."system:update"]
run = "./bin/system-update.ts"
description = "Update macOS system flake inputs, then validate"

[tasks.test]
run = [
  "bun install --frozen-lockfile",
  "bun run tsc --noEmit",
  "bun test ./tests ./home/.apm/skills/create-anki-cards/tools/anki-cards.test.ts",
]
description = "Run the dotfiles test suite"
