[tools]
bun = "1.3.12"

[tasks."agents:build"]
dir = "{{config_root}}/home"
run = "bun run ../scripts/build-agents.ts"
description = "Build agents resources via apm"

[tasks."agents:install"]
dir = "{{config_root}}/home"
run = "bun run ../scripts/build-agents.ts install"
description = "Install an agents skill via apm, then build agents resources"

[tasks."agents:remove-local"]
dir = "{{config_root}}/home"
run = "bun run ../scripts/build-agents.ts remove-local"
description = "Remove a repository-owned local agents skill, then build agents resources"

[tasks."agents:update"]
dir = "{{config_root}}/home"
run = "bun run ../scripts/build-agents.ts update"
description = "Update an agents skill via apm, then build agents resources"

[tasks."agents:uninstall"]
dir = "{{config_root}}/home"
run = "bun run ../scripts/build-agents.ts uninstall"
description = "Uninstall an agents skill via apm, then build agents resources"

[tasks."install:user"]
depends = ["apply"]
run = 'cd "$HOME" && "$HOME/.local/bin/mise" bootstrap --yes'
description = "Converge user tools from deployed home-directory config"

[tasks."install:system"]
run = "./scripts/install-system.sh"
description = "Converge the macOS system configuration"

[tasks.bootstrap]
depends = ["install:system", "install:user"]
description = "Converge the macOS system and user environments"

[tasks.apply]
run = "bun run scripts/link-home.ts"
description = "Apply the managed home tree to the home directory"

[tasks.plan]
run = "bun run scripts/link-home.ts --check"
description = "Show planned deploy actions without changing the filesystem"

[tasks.test]
run = "bun test"
description = "Run the dotfiles test suite"

[tasks.doctor]
run = "bun run scripts/doctor.ts"
description = "Diagnose deployment and package-manager drift"
