[tools]
bun = "1.3.12"
swift = "6.2.3"

[settings]
auto_install = false

[tasks."agents:build"]
run = "./bin/build-agents.ts"
description = "Build agents resources via apm"

[tasks."agents:install"]
run = "./bin/build-agents.ts install"
description = "Install an agents skill via apm, then build agents resources"

[tasks."agents:remove-local"]
run = "./bin/build-agents.ts remove-local"
description = "Remove a repository-owned local agents skill, then build agents resources"

[tasks."agents:update"]
run = "./bin/build-agents.ts update"
description = "Update an agents skill via apm, then build agents resources"

[tasks."agents:uninstall"]
run = "./bin/build-agents.ts uninstall"
description = "Uninstall an agents skill via apm, then build agents resources"

[tasks."mybin:build"]
run = "./bin/build-tada.sh"
description = "Build reproducible mybin assets"

[tasks."install:user"]
depends = ["apply"]
run = 'cd "$HOME" && "$HOME/.local/bin/mise" bootstrap --yes --verbose'
description = "Converge user tools from deployed home-directory config"

[tasks."install:system"]
run = "./bin/install-system.sh"
description = "Converge the macOS system configuration"

[tasks."install:system:generations"]
run = "sudo /run/current-system/sw/bin/darwin-rebuild --list-generations"
description = "List nix-darwin system generations"

[tasks."install:system:rollback"]
run = "sudo /run/current-system/sw/bin/darwin-rebuild --rollback"
description = "Switch back to the previous nix-darwin system generation"

[tasks.bootstrap]
depends = ["install:system", "install:user"]
description = "Converge the macOS system and user environments"

[tasks.apply]
run = "./bin/link-home.ts"
description = "Apply the managed home tree to the home directory"

[tasks.plan]
run = "./bin/link-home.ts --check"
description = "Show planned deploy actions without changing the filesystem"

[tasks.test]
run = [
  "bun install --frozen-lockfile",
  "bun run tsc --noEmit",
  "bun test ./tests ./home/.apm/skills/create-anki-cards/tools/anki-cards.test.ts",
]
description = "Run the dotfiles test suite"

[tasks.doctor]
run = "./bin/doctor.ts"
description = "Diagnose deployment and package-manager drift"
