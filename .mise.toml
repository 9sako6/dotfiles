[settings]
auto_install = false
task.run_auto_install = false

[dotfiles]
"~/.config" = { source = "home/.config", mode = "symlink-each" }
"~/.gitignore_global" = { source = "home/.gitignore_global", mode = "symlink" }
"~/.zsh.d/alias.zsh" = { source = "home/.zsh.d/alias.zsh", mode = "symlink" }
"~/.zsh.d/functions.zsh" = { source = "home/.zsh.d/functions.zsh", mode = "symlink" }
"~/.zsh.d/keybindings.zsh" = { source = "home/.zsh.d/keybindings.zsh", mode = "symlink" }
"~/.zsh.d/prompt.zsh" = { source = "home/.zsh.d/prompt.zsh", mode = "symlink" }
"~/.zsh.d/ssh-agent.zsh" = { source = "home/.zsh.d/ssh-agent.zsh", mode = "symlink" }
"~/.zshenv" = { source = "home/.zshenv", mode = "symlink" }
"~/.zshrc" = { source = "home/.zshrc", mode = "symlink" }
"~/mybin" = { source = "home/mybin", mode = "symlink-each" }

[tasks."agents:apply"]
run = "bun bin/agents-apply.ts apply"
description = "Generate and deploy agent resources"

[tasks."agents:install"]
run = "bun bin/agents-apply.ts install {{arg(name='package')}}"
description = "Install an APM dependency and deploy agent resources"

[tasks."agents:uninstall"]
run = "bun bin/agents-apply.ts uninstall {{arg(name='package')}}"
description = "Remove an APM dependency and deploy agent resources"

[tasks."agents:update"]
run = "bun bin/agents-apply.ts update"
description = "Update APM dependencies and deploy agent resources"

[tasks."herdr:integrations:apply"]
run = [
  "herdr integration install claude",
  "herdr integration install codex",
  "herdr integration install hermes",
  "herdr integration install opencode",
]
description = "Reconcile Herdr integrations"

[tasks."home:apply"]
run = "bun bin/home-apply.ts"
description = "Deploy home configuration and install user tools with mise"

[tasks."system:apply"]
run = "bun bin/system-apply.ts"
description = "Apply macOS, private configuration and Nix resources"

[tasks."system:rollback"]
run = "./bin/system-rollback.sh"
description = "Switch to the previous nix-darwin generation"
